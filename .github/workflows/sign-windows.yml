# Author/creator: nattapat2871 (https://nattapat2871.me)
name: Sign qualified Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to build, for example v1.2.4
        required: true
        type: string
      confirmation:
        description: Enter SIGNPATH_APPROVED after the SignPath Foundation project is active
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sign-windows-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sign Windows x64 installer
    runs-on: windows-latest
    environment: signpath-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ inputs.release_tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Validate explicit signing boundary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNING_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNING_CONFIRMATION -cne 'SIGNPATH_APPROVED') {
            throw 'Signing is disabled until the SignPath Foundation project is active and explicitly confirmed.'
          }
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Only stable numeric versions may be signed: $packageVersion"
          }
          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "release_tag must exactly equal $expectedTag."
          }
          $head = git rev-parse --verify 'HEAD^{commit}'
          $tagHead = git rev-parse --verify "refs/tags/$expectedTag^{commit}"
          if ($LASTEXITCODE -ne 0 -or $head -cne $tagHead) {
            throw 'The checked-out source does not exactly match the requested release tag.'
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'The signing checkout is not clean.'
          }

      - run: npm ci
      - run: npm test

      - name: Build unsigned qualified installer
        run: npm run dist:win
        env:
          NAMLAUNCHER_ERROR_REPORT_TOKEN: ${{ secrets.NAMLAUNCHER_ERROR_REPORT_TOKEN }}

      - name: Stage exactly one unsigned installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageVersion = node -p "require('./package.json').version"
          $expected = Join-Path 'release' "NamLauncher-$packageVersion-Installer.exe"
          if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
            throw "Expected installer is missing: $expected"
          }
          $installers = @(Get-ChildItem -LiteralPath 'release' -File -Filter 'NamLauncher-*-Installer.exe')
          if ($installers.Count -ne 1 -or $installers[0].FullName -cne (Resolve-Path -LiteralPath $expected).Path) {
            throw 'Expected exactly one version-matched installer before signing.'
          }
          New-Item -ItemType Directory -Path 'signing-input' | Out-Null
          Copy-Item -LiteralPath $expected -Destination 'signing-input'
          Get-FileHash -LiteralPath $expected -Algorithm SHA256

      - name: Upload unsigned signing input
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NamLauncher-Windows-x64-unsigned-signing-input
          path: signing-input/NamLauncher-*-Installer.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Submit SignPath signing request
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/signed

      - name: Verify the returned Authenticode signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = @(Get-ChildItem -LiteralPath 'release/signed' -Recurse -File -Filter '*.exe')
          if ($signed.Count -ne 1) {
            throw "Expected exactly one signed executable; found $($signed.Count)."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $signed[0].FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
            throw "Authenticode validation failed: $($signature.Status) $($signature.StatusMessage)"
          }
          Get-FileHash -LiteralPath $signed[0].FullName -Algorithm SHA256

      - name: Upload verified signed installer without publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NamLauncher-Windows-x64-signed-candidate
          path: release/signed/**/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
